name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tag and VERSION must agree, or the feed advertises one number and the app reports another.
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "Tag ${GITHUB_REF_NAME} != VERSION $v"; exit 1; }

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Rid ${{ matrix.rid }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: releases-${{ matrix.rid }}
          path: build/*/Releases/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "Lapsus ${GITHUB_REF_NAME#v}" --generate-notes \
            $(find out -type f)